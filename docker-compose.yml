version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: toyloop_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - toyloop_network

  backend:
    build:
      context: ./toyloop
      dockerfile: Dockerfile
    container_name: toyloop_backend
    restart: always
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL: ${MAIL}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      DURATION_TOKEN_JWT: ${DURATION_TOKEN_JWT}
      DURATION_REFRESH_TOKEN: ${DURATION_REFRESH_TOKEN}
      URL_RESET_PASSWORD: ${URL_RESET_PASSWORD}
    expose:
      - "8080"
    depends_on:
      - postgres
    networks:
      - toyloop_network

  frontend:
    build:
      context: ./frontend/eventhub
      dockerfile: Dockerfile
    container_name: toyloop_frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - toyloop_network

  nginx:
    image: nginx:alpine
    container_name: toyloop_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx-main.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - toyloop_network

volumes:
  postgres_data:

networks:
  toyloop_network:
    driver: bridge
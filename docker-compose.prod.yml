services:

  postgres:
    image: postgres:17-alpine
    container_name: toyloop_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - toyloop_network

  backend:
    image: victorpolicarpo2006/toyloop-backend:1.1
    container_name: toyloop_backend
    restart: always
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL: ${MAIL}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      DURATION_TOKEN_JWT: ${DURATION_TOKEN_JWT}
      DURATION_REFRESH_TOKEN: ${DURATION_REFRESH_TOKEN}
      URL_RESET_PASSWORD: ${URL_RESET_PASSWORD}
    expose:
      - "8080"
    depends_on:
      - postgres
    networks:
      - toyloop_network

volumes:
  postgres_data:

networks:
  toyloop_network:
    driver: bridge